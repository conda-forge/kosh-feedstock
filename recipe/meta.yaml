{% set name = "kosh" %}
{% set version = "3.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/LLNL/kosh/archive/{{ version }}.tar.gz
  sha256: 55a29d25f2cf3d4cc3c783bac395b9bfd84991a0feafbba5da66f01cb5497176

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - llnl-sina >=1.14.0
    - networkx >=2.6
    - numpy
    - matplotlib-base
    - scipy
    - h5py >=3
    - scikit-learn >=1.0.2
    - pandas
    - hdbscan
    - tqdm
    - cython <3
  run:
    - python >={{ python_min }}
    - llnl-sina >=1.14.0
    - networkx >=2.6
    - numpy
    - matplotlib-base
    - scipy
    - h5py >=3
    - scikit-learn >=1.0.2
    - pandas
    - hdbscan
    - tqdm
    - cython <3

test:
  imports:
    - kosh
  commands:
    - pip check
    - kosh --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/LLNL/kosh
  summary: Kosh allows codes to store, query, share and manipulate data via an easy-to-use Python API. Kosh lies on top of Sina and as a result can use any database backend supported by Sina. In adition Kosh aims to make data access and sharing as simple as possible.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - doutriaux1
